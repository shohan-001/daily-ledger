name: Windows exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the zip to this GitHub release (e.g. v0.2.7). Leave empty to only upload the artifact.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # MSVC 14.44+ errors on <experimental/coroutine> used by local_auth_windows.
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Build release
        run: |
          New-Item -ItemType Directory -Force -Path build/native_assets/windows | Out-Null
          flutter build windows --release

      - name: Zip the runnable folder
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$src/dailyledger.exe")) {
            throw "dailyledger.exe was not produced"
          }
          Compress-Archive -Path "$src\*" -DestinationPath "dailyledger-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dailyledger-windows-x64
          path: dailyledger-windows-x64.zip

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dailyledger-windows-x64.zip
